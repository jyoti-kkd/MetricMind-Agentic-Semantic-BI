cubes:
  - name: orders
    sql: METRICMIND_DB.RAW.CORPORATE_SALES_RAW
      
    # Pre-aggregation definitions go here.
    # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
    # pre_aggregations:

    measures:
      - name: count
        type: count

      - name: total_revenue
        sql: REVENUE
        type: sum

      - name: total_cost
        sql: COST
        type: sum

      - name: total_profit
        sql: REVENUE - COST
        type: sum

      - name: profit_margin
        sql: SUM(REVENUE - COST) / NULLIF(SUM(REVENUE), 0)
        type: number
        
    dimensions:
      - name: region
        sql: REGION
        type: string

      - name: country
        sql: COUNTRY
        type: string

      - name: order_date
        sql: ORDER_DATE
        type: time
